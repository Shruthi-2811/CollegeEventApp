<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

<header>

    <h1>Admin Login</h1>

    <p>
        College Event Registration System
    </p>

</header>


<nav>

    <a href="/">Home</a>

    <a href="/events.html">
        Events
    </a>

    <a href="/register.html">
        Register
    </a>

</nav>


<main>

    <div class="form-container">

        <h2>
            Authorized Admin Access
        </h2>


        <form
            action="/admin-login"
            method="POST"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >


            <br><br>

            <button
                type="submit"
                class="btn"
            >
                LOGIN
            </button>

        </form>


        <p
            style="
                text-align:center;
                margin-top:20px;
            "
        >
            Only authorized administrators
            can access this page.
        </p>

    </div>

</main>


<footer>

    <p>
        © 2026 College Event Registration System
    </p>

</footer>

</body>

</html>
